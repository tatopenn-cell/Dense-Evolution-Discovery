name: Pipeline CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements-ci.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install -r requirements-ci.txt
         

      - name: Cache Network Mock Cassettes
        id: cache-vcr
        uses: actions/cache@v4
        with:
          path: tests/cassettes/
          key: vcr-network-responses-${{ hashFiles('tests/**') }}
          restore-keys: |
            vcr-network-responses-

      - name: Run cross-validation tests (Dense Evolution vs PennyLane)
        run: |
          if [ "${{ steps.cache-vcr.outputs.cache-hit }}" = "true" ]; then
            pytest tests/ -v --tb=short --vcr-mode=none
          else
            pytest tests/ -v --tb=short --vcr-mode=all
          fi

      - name: Upload Simulation Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: silicon-vqe-results
          path: |
            vqe_molecola_silicio.csv
            curva_potenziale_silicio.png
            vqe_parameter_shift_plot.png
          retention-days: 7
