name: Pipeline CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect code changes
        id: scope
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          CODE=true
          if [ -n "$BASE" ] && [ "$BASE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            if git diff --name-only "$BASE" HEAD | grep -qE '\.py$|^requirements.*\.txt$'; then
              CODE=true
            else
              CODE=false
            fi
          fi
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "full tests: $CODE (they run only when a .py file or a requirements file changes)"

      - name: Set up Python 3.12
        if: steps.scope.outputs.code == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        if: steps.scope.outputs.code == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements-ci.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        if: steps.scope.outputs.code == 'true'
        run: pip install -r requirements-ci.txt

      - name: Run cross-validation tests (Dense Evolution vs PennyLane)
        if: steps.scope.outputs.code == 'true'
        run: pytest tests/ -v --tb=short

      - name: Upload Simulation Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: silicon-vqe-results
          path: |
            data/vqe_molecola_silicio.csv
            images/curva_potenziale_silicio.png
            images/vqe_parameter_shift_plot.png
          retention-days: 7
