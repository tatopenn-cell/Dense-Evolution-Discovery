<title>Discovery Mind Map</title>
<style>
  :root {
    --bg: #f4f6fa;
    --panel-bg: #ffffff;
    --ink: #16202c;
    --ink-dim: #55647a;
    --line: #c7d0de;
    --root: #16202c;
    --worm: #7b4fd6;
    --qec: #c9463f;
    --mit: #0f9c92;
    --vqe: #b8860f;
    --infra: #4c6b8a;
    --node-bg: #ffffff;
    --node-stroke: #c7d0de;
    --shadow: 0 10px 30px rgba(20, 30, 50, 0.12);
    --font-label: "IBM Plex Mono", ui-monospace, monospace;
    --font-body: "IBM Plex Sans", system-ui, sans-serif;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0b1120;
      --panel-bg: #121a2b;
      --ink: #e7ecf3;
      --ink-dim: #93a2ba;
      --line: #2a3550;
      --root: #e7ecf3;
      --worm: #b39dff;
      --qec: #ff7a72;
      --mit: #35e0d1;
      --vqe: #f0c34d;
      --infra: #8fb2d8;
      --node-bg: #16213a;
      --node-stroke: #2f3d5e;
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
    }
  }

  :root[data-theme="dark"] {
    --bg: #0b1120;
    --panel-bg: #121a2b;
    --ink: #e7ecf3;
    --ink-dim: #93a2ba;
    --line: #2a3550;
    --root: #e7ecf3;
    --worm: #b39dff;
    --qec: #ff7a72;
    --mit: #35e0d1;
    --vqe: #f0c34d;
    --infra: #8fb2d8;
    --node-bg: #16213a;
    --node-stroke: #2f3d5e;
    --shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    height: 100vh;
    overflow: hidden;
  }

  .app { display: flex; height: 100vh; width: 100vw; }
  .canvas-wrap { position: relative; flex: 1 1 auto; min-width: 0; overflow: hidden; }

  header {
    position: absolute; top: 0; left: 0; right: 0;
    padding: 18px 22px 10px;
    display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
    pointer-events: none; z-index: 5;
  }
  header .title {
    font-family: var(--font-label); font-size: 0.95rem; letter-spacing: 0.04em;
    color: var(--ink-dim); text-transform: uppercase;
  }
  header .hint { font-size: 0.8rem; color: var(--ink-dim); pointer-events: none; }

  svg#map { width: 100%; height: 100%; cursor: grab; touch-action: none; }
  svg#map:active { cursor: grabbing; }

  .edge { fill: none; stroke: var(--line); stroke-width: 1.4; opacity: 0.8; }

  .node-circle { stroke-width: 2.5; fill: var(--node-bg); transition: r 0.15s ease, filter 0.15s ease; }
  .node { cursor: pointer; }
  .node:hover .node-circle { filter: brightness(1.08); }
  .node.active .node-circle { fill: var(--cat-color, var(--ink)); }

  .node-label { font-family: var(--font-label); fill: var(--ink); pointer-events: none; user-select: none; }
  .node.root .node-label { font-size: 15px; font-weight: 600; }
  .node.category .node-label { font-size: 13px; font-weight: 600; }
  .node.leaf .node-label { font-size: 10.5px; fill: var(--ink-dim); }
  .node.active .node-label { fill: var(--panel-bg); }

  .legend {
    position: absolute; left: 22px; bottom: 20px;
    display: flex; flex-direction: column; gap: 6px;
    font-family: var(--font-label); font-size: 0.72rem; color: var(--ink-dim); z-index: 5;
  }
  .legend-item { display: flex; align-items: center; gap: 8px; }
  .swatch { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }

  .zoom-controls { position: absolute; right: 22px; bottom: 20px; display: flex; gap: 6px; z-index: 5; }
  .zoom-controls button {
    width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--node-stroke);
    background: var(--node-bg); color: var(--ink); font-size: 1rem; cursor: pointer; font-family: var(--font-body);
  }
  .zoom-controls button:hover { filter: brightness(1.1); }

  .panel {
    width: 380px; flex: none; background: var(--panel-bg);
    border-left: 1px solid var(--node-stroke); box-shadow: var(--shadow);
    padding: 26px 24px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px;
  }
  .panel.empty { align-items: center; justify-content: center; text-align: center; color: var(--ink-dim); }
  .panel .eyebrow {
    font-family: var(--font-label); font-size: 0.72rem; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--cat-color, var(--ink-dim));
  }
  .panel h2 { margin: 0; font-size: 1.25rem; font-family: var(--font-label); text-wrap: balance; }
  .panel .path {
    font-family: var(--font-label); font-size: 0.78rem; color: var(--ink-dim);
    background: var(--bg); padding: 4px 8px; border-radius: 6px; display: inline-block; width: fit-content;
  }
  .panel p { line-height: 1.55; font-size: 0.92rem; margin: 0; }
  .panel .kids { display: flex; flex-direction: column; gap: 6px; margin-top: 4px; }
  .panel .kids .kid-label {
    font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--ink-dim); font-family: var(--font-label);
  }
  .panel .kid-btn {
    text-align: left; background: var(--bg); border: 1px solid var(--node-stroke); color: var(--ink);
    padding: 8px 10px; border-radius: 8px; font-family: var(--font-body); font-size: 0.85rem; cursor: pointer;
  }
  .panel .kid-btn:hover { filter: brightness(1.06); }

  @media (max-width: 760px) {
    .app { flex-direction: column; }
    .panel { width: 100%; height: 42vh; border-left: none; border-top: 1px solid var(--node-stroke); }
    .canvas-wrap { height: 58vh; }
  }
</style>

<div class="app">
  <div class="canvas-wrap">
    <header>
      <div class="title">Dense-Evolution-Discovery &middot; mind map</div>
      <div class="hint">click a node · drag to pan · scroll to zoom</div>
    </header>
    <svg id="map" viewBox="0 0 1200 900"></svg>
    <div class="legend" id="legend"></div>
    <div class="zoom-controls">
      <button id="zoomOut" aria-label="Zoom out">&minus;</button>
      <button id="zoomReset" aria-label="Reset view">&#8634;</button>
      <button id="zoomIn" aria-label="Zoom in">+</button>
    </div>
  </div>
  <aside class="panel empty" id="panel">
    <div><p style="font-family: var(--font-label); font-size: 0.85rem;">Click any node to read what it does.</p></div>
  </aside>
</div>

<script>
(function () {
  "use strict";

  var CATS = {
    worm: { name: "Wormhole & Teleportation" },
    qec: { name: "Error Correction & Noise" },
    mit: { name: "Mitigation (ZNE family)" },
    vqe: { name: "VQE & Materials" },
    infra: { name: "Infrastructure & Meta" }
  };

  var DATA = {
    id: "root", label: "Discovery", kind: "root", path: "Dense-Evolution-Discovery/",
    detail: "Research-log repo built on the Dense-Evolution library: one script per experiment, version-bumped freely (it's a lab notebook, not a shipped package). 48 scripts under scripts/ as of this scan.",
    children: [
      {
        id: "worm", cat: "worm", label: "Wormhole & Teleportation", kind: "category",
        detail: "SYK-model traversable-wormhole teleportation reproductions and the magic-entropy (nonstabilizerness) diagnostics run on them.",
        children: [
          { id: "wme", cat: "worm", label: "wormhole_magic_entropy.py", kind: "leaf", path: "scripts/wormhole_magic_entropy.py", detail: "Joshi & Mishra WITP protocol (arXiv:2606.19180): cross-register Dirac coupling built via total_parity_operator's Klein-factor fix — a real Hermiticity bug found and fixed here first, later re-found and fixed differently (N%4==2 case) when the fix was promoted into the library." },
          { id: "wst", cat: "worm", label: "wormhole_syk_teleportation.py", kind: "leaf", path: "scripts/wormhole_syk_teleportation.py", detail: "SYK-model wormhole teleportation experiment — the core message-insertion/negative-energy-shockwave protocol family this repo's wormhole work is built around." },
          { id: "wns", cat: "worm", label: "wormhole_noise_scan_reverified.py", kind: "leaf", path: "scripts/wormhole_noise_scan_reverified.py", detail: "Re-verification pass scanning noise strength against teleportation fidelity for the wormhole protocol — a reverified/corrected rerun rather than a first pass." },
          { id: "wto", cat: "worm", label: "wormhole_term_order_noise_reverified.py", kind: "leaf", path: "scripts/wormhole_term_order_noise_reverified.py", detail: "Checks sensitivity of the wormhole protocol's result to SYK Hamiltonian term ordering under noise — a reverified/corrected rerun." },
          { id: "qrm", cat: "worm", label: "quantum_ruzsa_magic_entropy.py", kind: "leaf", path: "scripts/quantum_ruzsa_magic_entropy.py", detail: "Applies Ruzsa-distance-style additive-combinatorics reasoning to magic-entropy measures — the real gap identified in the Ruzsa papers that motivated deeper magic-entropy work this session." },
          { id: "qsm", cat: "worm", label: "quantum_shadows_magic_entropy.py", kind: "leaf", path: "scripts/quantum_shadows_magic_entropy.py", detail: "Classical-shadow-based estimator for magic entropy — the shadow estimator referenced as not yet promoted to the main library (kept as a research-only shadow measurement technique)." },
          { id: "srd", cat: "worm", label: "sandwiched_renyi_density_matrix.py", kind: "leaf", path: "scripts/sandwiched_renyi_density_matrix.py", detail: "Applies the sandwiched Renyi divergence (promoted to dense_evolution.mitigation.renyi) between density matrices in a real experiment context." }
        ]
      },
      {
        id: "qec", cat: "qec", label: "Error Correction & Noise", kind: "category",
        detail: "Steane-code logical-qubit experiments, cosmic-ray burst/erasure noise, and full noise-channel audits.",
        children: [
          { id: "st1", cat: "qec", label: "steane_code_block1.py", kind: "leaf", path: "scripts/steane_code_block1.py", detail: "First block of a multi-part Steane [[7,1,3]] code series — baseline logical-qubit encode/decode." },
          { id: "st2", cat: "qec", label: "steane_code_block2_adversarial_noise.py", kind: "leaf", path: "scripts/steane_code_block2_adversarial_noise.py", detail: "Steane code under a deliberately adversarial (worst-case, not random) noise model." },
          { id: "st3", cat: "qec", label: "steane_code_block3_linf_constrained_attack.py", kind: "leaf", path: "scripts/steane_code_block3_linf_constrained_attack.py", detail: "Steane code under an L-infinity-norm-constrained adversarial attack budget." },
          { id: "st4", cat: "qec", label: "steane_code_block4_stim_translation.py", kind: "leaf", path: "scripts/steane_code_block4_stim_translation.py", detail: "Cross-checks the Steane code series by translating the circuit into Stim (via dense_evolution.interop.to_stim) for independent stabilizer-simulator verification." },
          { id: "st5", cat: "qec", label: "steane_code_block5_qiskit_bridge.py", kind: "leaf", path: "scripts/steane_code_block5_qiskit_bridge.py", detail: "Cross-checks the Steane code series via the Qiskit interop bridge (from_qiskit/run_qiskit_circuit)." },
          { id: "st6", cat: "qec", label: "steane_code_block6_erasure_conversion.py", kind: "leaf", path: "scripts/steane_code_block6_erasure_conversion.py", detail: "Converts part of the Steane noise model into erasure errors (known-location losses) and re-tests decoding." },
          { id: "scr", cat: "qec", label: "steane_continuous_logical_rotation.py", kind: "leaf", path: "scripts/steane_continuous_logical_rotation.py", detail: "Tests continuous (non-Clifford) logical rotations on the Steane-encoded qubit rather than only discrete gates." },
          { id: "crb", cat: "qec", label: "cosmic_ray_burst_validation.py", kind: "leaf", path: "scripts/cosmic_ray_burst_validation.py", detail: "Validates dense_evolution.noise's cosmic-ray-burst error profile against expected transient correlated-error behavior." },
          { id: "cre", cat: "qec", label: "cosmic_ray_erasure_decoding.py", kind: "leaf", path: "scripts/cosmic_ray_erasure_decoding.py", detail: "Erasure-aware decoding specifically for cosmic-ray-burst-induced losses." },
          { id: "aan", cat: "qec", label: "audit_all_noise_channels_ghz.py", kind: "leaf", path: "scripts/audit_all_noise_channels_ghz.py", detail: "Runs every Kraus noise channel dense_evolution ships against a GHZ state as a single sweeping sanity audit." },
          { id: "con", cat: "qec", label: "channel_order_noncommutativity.py", kind: "leaf", path: "scripts/channel_order_noncommutativity.py", detail: "Demonstrates that applying two noise channels in different orders gives different results — noise channels don't commute in general." },
          { id: "htfp", cat: "qec", label: "healing_trigger_false_positive_audit.py", kind: "leaf", path: "scripts/healing_trigger_false_positive_audit.py", detail: "Audits the vector-healing trigger logic for false positives — does it fire when nothing is actually wrong." },
          { id: "qds", cat: "qec", label: "quantum_defect_scanner.py", kind: "leaf", path: "scripts/quantum_defect_scanner.py", detail: "Scans a parameter range looking for defect signatures in circuit output — a noise/error diagnostic sweep." },
          { id: "rot", cat: "qec", label: "resilient_operational_topologies.py", kind: "leaf", path: "scripts/resilient_operational_topologies.py", detail: "Compares circuit topologies for resilience to noise/errors." }
        ]
      },
      {
        id: "mit", cat: "mit", label: "Mitigation (ZNE family)", kind: "category",
        detail: "Zero-Noise Extrapolation in its many forms — adaptive gradients, photonic variants, oscillating-noise robustness — plus the classical KL-divergence diagnostic.",
        children: [
          { id: "zm", cat: "mit", label: "zne_mitigation.py", kind: "leaf", path: "scripts/zne_mitigation.py", detail: "Baseline Zero-Noise Extrapolation demonstration using dense_evolution.mitigation.zne." },
          { id: "zmv", cat: "mit", label: "zne_mitigation_verification.py", kind: "leaf", path: "scripts/zne_mitigation_verification.py", detail: "Verification pass cross-checking the ZNE mitigation result against an independent method." },
          { id: "zpb", cat: "mit", label: "zne_physically_bounded.py", kind: "leaf", path: "scripts/zne_physically_bounded.py", detail: "ZNE extrapolation constrained to stay within physically valid bounds (uses project_to_physical-style guarantees)." },
          { id: "zsn", cat: "mit", label: "zne_snr_adaptive_psr_gradient.py", kind: "leaf", path: "scripts/zne_snr_adaptive_psr_gradient.py", detail: "Parameter-shift-rule gradient estimation with ZNE, adapting to signal-to-noise ratio." },
          { id: "zst", cat: "mit", label: "zne_stabilized_psr_gradient.py", kind: "leaf", path: "scripts/zne_stabilized_psr_gradient.py", detail: "A stabilized variant of the ZNE+parameter-shift gradient estimator, for noisier regimes." },
          { id: "zap", cat: "mit", label: "zne_adaptive_psr_gradient.py", kind: "leaf", path: "scripts/zne_adaptive_psr_gradient.py", detail: "Adaptive-step-size parameter-shift-rule gradient with ZNE correction." },
          { id: "jzo", cat: "mit", label: "jsd_zne_oscillating_noise.py", kind: "leaf", path: "scripts/jsd_zne_oscillating_noise.py", detail: "Tests ZNE robustness under an oscillating (time-varying) noise-rate profile, graded by Jensen-Shannon divergence." },
          { id: "lez", cat: "mit", label: "loschmidt_echo_zne.py", kind: "leaf", path: "scripts/loschmidt_echo_zne.py", detail: "Applies ZNE to a Loschmidt-echo (forward-backward evolution fidelity) measurement." },
          { id: "ppz", cat: "mit", label: "photonic_predictive_zne.py", kind: "leaf", path: "scripts/photonic_predictive_zne.py", detail: "ZNE variant tailored to a photonic-noise model, with predictive (not just interpolative) extrapolation." },
          { id: "pzm", cat: "mit", label: "photonic_zne_multi_circuit_postselection.py", kind: "leaf", path: "scripts/photonic_zne_multi_circuit_postselection.py", detail: "Photonic ZNE combined with postselection across multiple circuit variants." },
          { id: "kld", cat: "mit", label: "kullback_leibler_divergence.py", kind: "leaf", path: "scripts/kullback_leibler_divergence.py", detail: "Applies dense_evolution.mitigation.kl_divergence (classical KL over measurement-outcome distributions) — the experiment that motivated promoting kl_divergence to the library." }
        ]
      },
      {
        id: "vqe", cat: "vqe", label: "VQE & Materials", kind: "category",
        detail: "Variational quantum eigensolver runs for real molecules and materials (silicon, germanium), plus Ising-model and tight-binding cross-checks.",
        children: [
          { id: "veg", cat: "vqe", label: "vqe_extreme_geometries.py", kind: "leaf", path: "scripts/vqe_extreme_geometries.py", detail: "VQE energy scans at extreme (stretched/compressed) molecular geometries, away from equilibrium bond length." },
          { id: "vegd", cat: "vqe", label: "vqe_extreme_geometries_deep.py", kind: "leaf", path: "scripts/vqe_extreme_geometries_deep.py", detail: "Deeper follow-up to the extreme-geometries VQE scan — more geometries and/or more optimizer iterations." },
          { id: "vg", cat: "vqe", label: "vqe_gradient.py", kind: "leaf", path: "scripts/vqe_gradient.py", detail: "VQE gradient computation baseline." },
          { id: "vjg", cat: "vqe", label: "vqe_jax_grad.py", kind: "leaf", path: "scripts/vqe_jax_grad.py", detail: "VQE via dense_evolution.solvers.circuit_to_energy_fn's JAX autodiff gradient, rather than parameter-shift." },
          { id: "vsm", cat: "vqe", label: "vqe_silicon_molecular.py", kind: "leaf", path: "scripts/vqe_silicon_molecular.py", detail: "VQE applied to a silicon-containing molecular system." },
          { id: "vsmo", cat: "vqe", label: "vqe_silicon_molecular_optimized.py", kind: "leaf", path: "scripts/vqe_silicon_molecular_optimized.py", detail: "Performance-optimized rerun of the silicon-molecular VQE experiment." },
          { id: "vsmb", cat: "vqe", label: "vqe_silicon_molecular_optimized_per_bond.py", kind: "leaf", path: "scripts/vqe_silicon_molecular_optimized_per_bond.py", detail: "Per-bond-optimized variant of the silicon-molecular VQE run — separate optimization per bond rather than globally." },
          { id: "vtmi", cat: "vqe", label: "vqe_tmi_material_design.py", kind: "leaf", path: "scripts/vqe_tmi_material_design.py", detail: "VQE-driven material-design exploration using a tripartite-mutual-information (TMI) figure of merit." },
          { id: "hvv", cat: "vqe", label: "harrison_vhd_validation.py", kind: "leaf", path: "scripts/harrison_vhd_validation.py", detail: "Validates dense_evolution.solvers' Harrison and VHD tight-binding Hamiltonian builders against known band-structure results." },
          { id: "giv", cat: "vqe", label: "germanium_iswap_validation.py", kind: "leaf", path: "scripts/germanium_iswap_validation.py", detail: "Validates an iSWAP gate reproduction (arXiv:2608.16716) on germanium qubits via dense_evolution.circuits.trotter plus a real SPAM depolarizing channel — built to justify a library version bump." },
          { id: "ngs", cat: "vqe", label: "next_gen_silicon.py", kind: "leaf", path: "scripts/next_gen_silicon.py", detail: "Exploration of next-generation silicon-qubit device parameters." },
          { id: "mth", cat: "vqe", label: "manufacturing_thermodynamics.py", kind: "leaf", path: "scripts/manufacturing_thermodynamics.py", detail: "Thermodynamic modeling relevant to qubit manufacturing processes." },
          { id: "iev", cat: "vqe", label: "ising_exact_verification.py", kind: "leaf", path: "scripts/ising_exact_verification.py", detail: "Exact-diagonalization verification baseline for the Ising-model experiments in this repo." },
          { id: "ifv", cat: "vqe", label: "ising_freefermion_verification.py", kind: "leaf", path: "scripts/ising_freefermion_verification.py", detail: "Free-fermion (Jordan-Wigner) analytic cross-check for the Ising-model experiments." },
          { id: "si", cat: "vqe", label: "scan_ising.py", kind: "leaf", path: "scripts/scan_ising.py", detail: "Parameter scan over the transverse-field Ising model." },
          { id: "siv", cat: "vqe", label: "scan_ising_vqe.py", kind: "leaf", path: "scripts/scan_ising_vqe.py", detail: "VQE-based version of the Ising-model parameter scan." },
          { id: "pli", cat: "vqe", label: "plot_ising.py", kind: "leaf", path: "scripts/plot_ising.py", detail: "Plotting helper for the Ising-model scan results." }
        ]
      },
      {
        id: "infra", cat: "infra", label: "Infrastructure & Meta", kind: "category",
        detail: "Cross-cutting infrastructure experiments (disk-backed Chunk distribution) and vector-healing / self-reflection diagnostics that don't belong to one physics domain.",
        children: [
          { id: "cdde", cat: "infra", label: "chunk_distributed_disk_experiment.py", kind: "leaf", path: "scripts/chunk_distributed_disk_experiment.py", detail: "Exercises dense_evolution.backends.chunk's distributed/disk-overflow behavior directly — the real-world proving ground for the Chunk anti-OOM design." },
          { id: "svh", cat: "infra", label: "stratonovich_vector_healing.py", kind: "leaf", path: "scripts/stratonovich_vector_healing.py", detail: "Vector-healing experiment using a Stratonovich-calculus formulation of the correction dynamics." },
          { id: "ldh", cat: "infra", label: "leaky_differentiable_healing.py", kind: "leaf", path: "scripts/leaky_differentiable_healing.py", detail: "Differentiable (JAX-autodiff-compatible) vector-healing variant that deliberately allows some leakage." },
          { id: "sr", cat: "infra", label: "sophia_reflection.py", kind: "leaf", path: "scripts/sophia_reflection.py", detail: "Companion script to the repo's SOPHIA_REFLECTION.md — a self-reflection/meta-analysis pass over the research process itself, not a physics experiment." },
          { id: "qsi", cat: "infra", label: "quantum_scar_investigation/", kind: "leaf", path: "scripts/quantum_scar_investigation/", detail: "The only subdirectory under scripts/ — a multi-file investigation into quantum many-body scarring (anomalously slow thermalization)." }
        ]
      }
    ]
  };

  var CX = 600, CY = 460, R_CAT = 150, R_LEAF = 340;
  var nodes = [], edges = [];

  function place(node, angle, radius, parentId) {
    var x = CX + Math.cos(angle) * radius, y = CY + Math.sin(angle) * radius;
    node.x = x; node.y = y;
    nodes.push(node);
    if (parentId) edges.push({ from: parentId, to: node.id, cat: node.cat });
  }

  place(DATA, 0, 0, null);
  var catCount = DATA.children.length;
  DATA.children.forEach(function (cat, i) {
    var catAngle = -Math.PI / 2 + i * (2 * Math.PI / catCount);
    place(cat, catAngle, R_CAT, DATA.id);
    var n = cat.children.length;
    var spread = Math.min(1.3, 0.16 * n);
    cat.children.forEach(function (leaf, j) {
      var t = n === 1 ? 0.5 : j / (n - 1);
      var leafAngle = catAngle - spread / 2 + t * spread;
      place(leaf, leafAngle, R_LEAF, cat.id);
    });
  });

  var byId = {};
  nodes.forEach(function (n) { byId[n.id] = n; });

  var svg = document.getElementById("map");
  var svgNS = "http://www.w3.org/2000/svg";
  function el(tag, attrs) {
    var e = document.createElementNS(svgNS, tag);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    return e;
  }

  var world = el("g", { id: "world" });
  svg.appendChild(world);

  edges.forEach(function (e) {
    var a = byId[e.from], b = byId[e.to];
    var mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    var dx = b.y - a.y, dy = -(b.x - a.x);
    var norm = Math.sqrt(dx * dx + dy * dy) || 1;
    var bend = 18;
    var cx = mx + (dx / norm) * bend, cy = my + (dy / norm) * bend;
    var path = el("path", {
      class: "edge",
      d: "M " + a.x + " " + a.y + " Q " + cx + " " + cy + " " + b.x + " " + b.y,
      stroke: e.cat ? "var(--" + e.cat + ")" : "var(--line)",
      "stroke-opacity": e.cat ? "0.45" : "0.7"
    });
    world.appendChild(path);
  });

  nodes.forEach(function (n) {
    var r = n.kind === "root" ? 30 : n.kind === "category" ? 22 : 13;
    var g = el("g", { class: "node " + n.kind, "data-id": n.id, transform: "translate(" + n.x + "," + n.y + ")" });
    if (n.cat) g.style.setProperty("--cat-color", "var(--" + n.cat + ")");
    var circle = el("circle", { class: "node-circle", r: r, stroke: n.cat ? "var(--" + n.cat + ")" : "var(--root)" });
    g.appendChild(circle);
    var label = el("text", { class: "node-label", x: 0, y: r + 15, "text-anchor": "middle" });
    label.textContent = n.label;
    if (n.kind === "root") { label.setAttribute("y", 4); label.setAttribute("dominant-baseline", "middle"); }
    g.appendChild(label);
    g.addEventListener("click", function () { selectNode(n.id); });
    world.appendChild(g);
  });

  var panel = document.getElementById("panel");
  function selectNode(id) {
    document.querySelectorAll(".node.active").forEach(function (g) { g.classList.remove("active"); });
    var g = svg.querySelector('.node[data-id="' + id + '"]');
    if (g) g.classList.add("active");
    var n = byId[id];
    var catInfo = n.cat ? CATS[n.cat] : null;
    var html = "";
    html += '<div class="eyebrow" style="--cat-color:' + (n.cat ? "var(--" + n.cat + ")" : "var(--ink-dim)") + '">' +
      (catInfo ? catInfo.name : (n.kind === "root" ? "Repository root" : "")) + "</div>";
    html += "<h2>" + n.label + "</h2>";
    if (n.path) html += '<div class="path">' + n.path + "</div>";
    html += "<p>" + n.detail + "</p>";
    if (n.children && n.children.length) {
      html += '<div class="kids"><div class="kid-label">Contains</div>';
      n.children.forEach(function (c) { html += '<button class="kid-btn" data-goto="' + c.id + '">' + c.label + "</button>"; });
      html += "</div>";
    }
    panel.className = "panel";
    panel.innerHTML = html;
    panel.querySelectorAll("[data-goto]").forEach(function (btn) {
      btn.addEventListener("click", function () { selectNode(btn.getAttribute("data-goto")); });
    });
  }

  var legend = document.getElementById("legend");
  Object.keys(CATS).forEach(function (k) {
    var item = document.createElement("div");
    item.className = "legend-item";
    item.innerHTML = '<span class="swatch" style="background:var(--' + k + ')"></span>' + CATS[k].name;
    legend.appendChild(item);
  });

  var scale = 1, tx = 0, ty = 0, dragging = false, lastX = 0, lastY = 0;
  function applyTransform() { world.setAttribute("transform", "translate(" + tx + "," + ty + ") scale(" + scale + ")"); }
  svg.addEventListener("pointerdown", function (e) { dragging = true; lastX = e.clientX; lastY = e.clientY; svg.setPointerCapture(e.pointerId); });
  svg.addEventListener("pointermove", function (e) { if (!dragging) return; tx += (e.clientX - lastX); ty += (e.clientY - lastY); lastX = e.clientX; lastY = e.clientY; applyTransform(); });
  svg.addEventListener("pointerup", function () { dragging = false; });
  svg.addEventListener("wheel", function (e) { e.preventDefault(); var delta = e.deltaY > 0 ? 0.9 : 1.1; scale = Math.max(0.35, Math.min(2.5, scale * delta)); applyTransform(); }, { passive: false });
  document.getElementById("zoomIn").addEventListener("click", function () { scale = Math.min(2.5, scale * 1.2); applyTransform(); });
  document.getElementById("zoomOut").addEventListener("click", function () { scale = Math.max(0.35, scale * 0.8); applyTransform(); });
  document.getElementById("zoomReset").addEventListener("click", function () { scale = 1; tx = 0; ty = 0; applyTransform(); });

  selectNode("root");
})();
</script>
