site_name: Dense-Evolution-Discovery
site_description: Cross-validation and physics experiments built on the Dense-Evolution quantum simulator.
site_url: https://tatopenn-cell.github.io/Dense-Evolution-Discovery/
repo_url: https://github.com/tatopenn-cell/Dense-Evolution-Discovery
repo_name: tatopenn-cell/Dense-Evolution-Discovery
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
  icon:
    repo: fontawesome/brands/github
    logo: material/atom

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.arithmatex:
      generic: true
  - toc:
      permalink: true

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

plugins:
  - search

nav:
  - Home: index.md
  - Repository:
    - Architecture & Ecosystem: repository_architecture.md
  - Density-Matrix Diagnostics:
    - Sandwiched Renyi Divergence: sandwiched_renyi_density_matrix.md
    - Quantum Ruzsa Key Unitary & Magic Entropy: quantum_ruzsa_magic_entropy.md
    - "Classical Shadows: Bug Fix & Magic Entropy Estimation": quantum_shadows_magic_entropy.md
    - Kullback-Leibler Divergence: kullback_leibler_divergence.md
  - Vector Healing:
    - Stratonovich-Projection Vector Healing: stratonovich_vector_healing.md
    - Healing Trigger False-Positive Audit: healing_trigger_false_positive_audit.md
    - Leaky-Switch Differentiable Healing: leaky_differentiable_healing.md
    - "ZNE Healing-Branch Sigma Provenance: a Confound": zne_healing_sigma_provenance.md
    - Central Charge (Calabrese-Cardy): central_charge_calabrese_cardy.md
  - Other Investigations:
    - Harrison / VHD Tight-Binding: harrison_tight_binding.md
    - Traversable-Wormhole Teleportation: wormhole_syk_teleportation.md
    - Photonic Predictive ZNE: photonic_predictive_zne.md
    - Negative Time (Weak-Value Group Delay): negative_time_group_delay.md
    - Quantum Many-Body Scar Investigation: quantum_scar_investigation.md
    - Germanium iSWAP Validation: germanium_iswap_validation.md
    - Cosmic-Ray Burst Validation: cosmic_ray_burst_validation.md
    - "Chunk: Distributed & Disk-Backed Simulation": chunk_distributed_disk_experiment.md
